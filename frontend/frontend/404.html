<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! You've wandered off</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f0eb 0%, #e8ddd0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.12);
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .emoji { font-size: 80px; display: block; margin-bottom: 20px; }
        h1 { font-size: 28px; color: #2c3e50; margin-bottom: 12px; }
        p { color: #7f8c8d; line-height: 1.8; margin-bottom: 24px; }
        a {
            display: inline-block;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(192, 57, 43, 0.3);
        }
        .suggestions { margin-top: 20px; font-size: 14px; color: #95a5a6; }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji">🎈</span>
        <h1>You've wandered off!</h1>
        <p>Looks like you took a wrong turn.<br>The family reunion is this way!</p>
        <a href="/">🎯 Take Me Home</a>
        <div class="suggestions">
            💡 Maybe you're looking for the RSVP page?
        </div>
    </div>
</body>
</html>
