services:
  redis:
    image: redis:alpine
    container_name: rsvp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - rsvp_network

  backend:
    build: ./backend
    container_name: rsvp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - rsvp_network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  worker:
    build: ./backend
    container_name: rsvp_worker
    restart: unless-stopped
    command: python worker.py
    depends_on:
      - redis
      - backend
    networks:
      - rsvp_network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  nginx:
    image: nginx:alpine
    container_name: rsvp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - rsvp_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  rsvp_network:
    driver: bridge